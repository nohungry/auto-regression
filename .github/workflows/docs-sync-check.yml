name: Docs Sync Check

# 對 PR 變動做 code-vs-docs 同步檢查。
# - PR 內任一 commit message 含 [skip-docs-check] 或設 SKIP_DOCS_CHECK=1 → 略過
# - 違規 → job fail（PR check 顯示紅，不強制 block merge；要強制可在 Settings → Branches 設 required check）

on:
  pull_request:
    branches: [main]

# 強制 actions 用 Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs-sync-check:
    name: Docs Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout (fetch full history to diff against base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 預設 1 不夠，需有 base SHA 才能 diff

      - name: Run docs sync check
        run: |
          # PR base commit SHA（GitHub Actions context 內建）
          bash .github/scripts/check-docs-sync.sh ${{ github.event.pull_request.base.sha }}

  factory-import-check:
    name: Factory import guard
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tests/ route POM imports through factory
        run: |
          # CI 模式（傳 arg）掃 tests/ 全樹，非 diff —— 可抓搬檔/改名逃逸（D-023）
          bash .github/scripts/check-factory-import.sh ci

  uv-requirements-sync:
    name: uv requirements export sync
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Verify requirements.txt matches uv.lock export
        run: |
          # --frozen：pyproject 改了但沒跑 uv lock → 直接紅（不靜默 re-lock）
          # diff 忽略註解行：export header 記錄的指令字串（-o vs stdout）不影響判定
          diff <(uv export --frozen --no-hashes | grep -v '^#') <(grep -v '^#' requirements.txt) \
            || { echo '::error::requirements.txt 與 uv.lock 不同步，請執行 uv export --no-hashes -o requirements.txt'; exit 1; }
