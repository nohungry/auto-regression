[pytest]
# 預設執行參數
addopts =
    --html=reports/report.html
    --self-contained-html
    -v

# Flaky test 處理（pytest-rerunfailures）：
# 不在 addopts 全局開 reruns，避免：
# (1) 真實 transient regression 被 retry 蓋掉變 false negative；
# (2) CI 時間 worst case 翻倍。
# 改用 @pytest.mark.flaky(reruns=N, reruns_delay=N) 標在「已知偶發 flaky」
# 的個別 test / class 上（與 docs/testing-strategy.md「Flaky Test 處理原則」一致）。
# 目前無 test 標記 flaky（marker 保留供未來使用）：
#   - RC 錯誤登入 test 改用 @pytest.mark.no_toast_observer（停用 observer）。
#   - RF 錯誤登入 test 於 LoginPage 改「等 base-modal 消失」後穩定，已移除標記。

# 測試檔案位置
testpaths = tests

# 標記定義
markers =
    p0: P0 核心測試，每次 Release 必跑
    p1: P1 重要測試，重大版本跑
    p2: P2 一般測試，完整回歸跑
    login: 登入相關測試
    home: 首頁相關測試
    lt: lt 站點（LT來財）專屬測試
    rc: rc 站點（王老吉娛樂城）專屬測試
    re: re 站點（BeWin）專屬測試
    rd: rd 站點（狗狗娛樂城）專屬測試
    qw: qw 站點（LM來財娛樂城）專屬測試
    lg: lg 站點（大撈家娛樂城）專屬測試
    lu: lu 站點（Dlgbet）專屬測試
    rf: rf 站點（金爺娛樂城）專屬測試
    i18n: 多語系文案驗證
    copy: 文案一致性驗證
    visual: 視覺健康度驗證（DOM metrics）
    visual_regression: 截圖 baseline 比對（需先建立 baseline）
    locale_layout: 多語系版面健康度（overflow + DOM fingerprint，環境無關）
    docker_only: 僅在固定 Docker 環境執行（例如 pixel-level snapshot）
    language: 多語系切換與登入表單驗證
    api: API 層測試（不啟動瀏覽器，使用 requests 直打 API）
    wallet: 錢包/餘額/存款相關測試
    member: 會員功能（個人資料/收件匣）相關測試
    dashboard: 後台管理介面測試
    game: 遊戲進入/下注相關測試
    flaky: 已知偶發 flaky 測試（pytest-rerunfailures 提供，需附原因；見 docs/testing-strategy.md）
    no_toast_observer: 停用全域 toast auto-close observer（需斷言 toast/錯誤彈窗可見的 test 用）
