[pytest]
# 預設執行參數
addopts =
    --html=reports/report.html
    --self-contained-html
    --reruns 1
    --reruns-delay 5
    -v

# Flaky test 處理（pytest-rerunfailures）：
# - --reruns 1：失敗的 test 自動 retry 1 次
# - --reruns-delay 5：retry 前等 5 秒（讓網路 / dev 站短暫不穩穩定）
# 用途：吸收 RC 站偶發 flaky（toast race / dev-rc 偶發 timeout）
# 真實 RD bug（5305 遊戲後端、破圖）兩次都會 fail，訊號不會被淹沒

# 測試檔案位置
testpaths = tests

# 標記定義
markers =
    p0: P0 核心測試，每次 Release 必跑
    p1: P1 重要測試，重大版本跑
    p2: P2 一般測試，完整回歸跑
    login: 登入相關測試
    home: 首頁相關測試
    lt: lt 站點（LT來財）專屬測試
    rc: rc 站點（王老吉娛樂城）專屬測試
    re: re 站點（BeWin）專屬測試
    rd: rd 站點（狗狗娛樂城）專屬測試
    i18n: 多語系文案驗證
    copy: 文案一致性驗證
    visual: 視覺健康度驗證（DOM metrics）
    visual_regression: 截圖 baseline 比對（需先建立 baseline）
    locale_layout: 多語系版面健康度（overflow + DOM fingerprint，環境無關）
    docker_only: 僅在固定 Docker 環境執行（例如 pixel-level snapshot）
    language: 多語系切換與登入表單驗證
    api: API 層測試（不啟動瀏覽器，使用 requests 直打 API）
    wallet: 錢包/餘額/存款相關測試
    member: 會員功能（個人資料/收件匣）相關測試
    dashboard: 後台管理介面測試
    game: 遊戲進入/下注相關測試
